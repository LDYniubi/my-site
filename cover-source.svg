<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="45"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- big decorative code bracket -->
  <text x="900" y="360" font-family="Consolas, monospace" font-size="240" font-weight="700" fill="rgba(255,255,255,0.04)" text-anchor="middle" transform="rotate(-12 900 360)">&lt;/&gt;</text>

  <!-- glass card -->
  <rect x="90" y="95" width="1020" height="440" rx="28" ry="28" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- top label -->
  <text x="150" y="165" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" fill="#94a3b8" letter-spacing="2">BIUH WEB TECHNOLOGIES 2026</text>

  <!-- main title -->
  <text x="150" y="255" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="86" font-weight="700" fill="url(#textGrad)">Li Dongyang</text>

  <!-- subtitle -->
  <text x="150" y="315" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="300" fill="#e2e8f0">Personal Website</text>

  <!-- description -->
  <text x="150" y="370" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Hand-coded with HTML, CSS &amp; JavaScript</text>
  <text x="150" y="405" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">Quotes · Project Ideas · Useless Machine · About Me</text>

  <!-- feature pills -->
  <g transform="translate(150, 445)">
    <rect x="0" y="0" width="68" height="34" rx="17" fill="rgba(249,115,22,0.18)" stroke="rgba(249,115,22,0.45)" stroke-width="1"/>
    <text x="34" y="23" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="600" fill="#f97316" text-anchor="middle">HTML</text>

    <rect x="84" y="0" width="58" height="34" rx="17" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.40)" stroke-width="1"/>
    <text x="113" y="23" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="600" fill="#38bdf8" text-anchor="middle">CSS</text>

    <rect x="158" y="0" width="116" height="34" rx="17" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.40)" stroke-width="1"/>
    <text x="216" y="23" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="600" fill="#a855f7" text-anchor="middle">JavaScript</text>
  </g>

  <!-- bottom-right student id -->
  <text x="1030" y="500" font-family="Consolas, monospace" font-size="20" font-weight="500" fill="#64748b" text-anchor="end">X20240068</text>
</svg>
